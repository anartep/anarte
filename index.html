<!doctype html>
<html lang="pt-BR" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Anarte — Ana Paula Silva · Ilustradora</title>
    <meta name="description" content="Portfólio de Ana Paula Silva (Anarte): ilustradora digital especializada em capas de livros, personagens, mapas ilustrados e projetos editoriais." />
    <meta name="theme-color" content="#a95af8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Anarte — Ana Paula Silva · Ilustradora" />
    <meta property="og:description" content="Capas de livros, personagens, mapas ilustrados e projetos editoriais." />
    <meta property="og:image" content="https://anartep.github.io/anarte/og-image.jpg" />
    <meta property="og:url" content="https://anartep.github.io/anarte/" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // aplica o tema salvo antes da primeira pintura (evita "piscar")
      try {
        var t = localStorage.getItem('anarte-theme');
        if (t === 'day' || t === 'night') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
